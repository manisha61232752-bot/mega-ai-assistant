services:
  - type: web
    name: mega-ai-assistant-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-flash-latest"
      - key: BACKEND_CORS_ORIGINS
        value: "[\"https://mega-ai-assistant.vercel.app\", \"https://mega-ai-assistant-8p0ro4rxa-manisha61232752-3380s-projects.vercel.app\", \"http://localhost:5173\", \"http://127.0.0.1:5173\"]"
