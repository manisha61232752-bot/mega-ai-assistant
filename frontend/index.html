    <script>
      (function() {
        const mode = localStorage.getItem('mega_theme_mode') || 'system';
        let dark = false;
        if (mode === 'dark') {
          dark = true;
        } else if (mode === 'light') {
          dark = false;
        } else {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (dark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
